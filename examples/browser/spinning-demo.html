<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spinning Wheel + Drivetrain Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: #e5e7eb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 18px 24px 10px;
      border-bottom: 1px solid #263244;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(360px, .8fr);
      gap: 16px;
      padding: 16px;
    }

    section {
      min-width: 0;
      background: #f8fafc;
      color: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: #e5e7eb;
      border-bottom: 1px solid #cbd5e1;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      color: #263244;
    }

    .panel-title span:last-child {
      font-weight: 700;
      color: #64748b;
      text-transform: none;
    }

    .preview {
      display: grid;
      place-items: center;
      min-height: 340px;
      background: #ffffff;
      overflow: hidden;
    }

    .hero .preview {
      min-height: calc(100vh - 108px);
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .side-stack {
      display: grid;
      gap: 16px;
    }

    .side-stack .preview {
      min-height: 250px;
      height: calc((100vh - 132px) / 2);
    }

    @media (max-width: 1000px) {
      main {
        grid-template-columns: 1fr;
      }

      .hero .preview,
      .side-stack .preview {
        min-height: 320px;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Spinning Wheel + Drivetrain Demo</h1>
  </header>
  <main>
    <section class="hero">
      <div class="panel-title">
        <span>Animated drivetrain with rear wheel</span>
        <span>single packed SVG</span>
      </div>
      <div class="preview">
        <img src="../svg/wheel-drivetrain-animated.svg" alt="Animated drivetrain with rear wheel spinning">
      </div>
    </section>

    <div class="side-stack">
      <section>
        <div class="panel-title">
          <span>Drive-side wheel assembly</span>
          <span>cassette centered on hub</span>
        </div>
        <div class="preview">
          <img src="../svg/rear-assembly-drive-face.svg" alt="Rear wheel drive-side face with cassette installed">
        </div>
      </section>

      <section>
        <div class="panel-title">
          <span>Side assembly</span>
          <span>cassette mounted on freehub</span>
        </div>
        <div class="preview">
          <img src="../svg/rear-assembly-side.svg" alt="Rear hub side view with cassette mounted on freehub">
        </div>
      </section>
    </div>
  </main>
</body>
</html>
